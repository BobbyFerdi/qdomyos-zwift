<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Training Programs Browser</title>
    <style>
        :root {
            --bg: #1c1c22;
            --panel: #26262e;
            --elevated: #2e2e38;
            --border: rgba(255, 255, 255, 0.09);
            --text: #f4f4f8;
            --muted: #9a9aa8;
            --accent: #7c4dff;
            --accent-hover: #8f66ff;
            --accent-soft: rgba(124, 77, 255, 0.22);
            --folder: #ffb74d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            height: calc(100vh - 72px);
            gap: 14px;
            padding: 14px;
        }

        .left-panel {
            flex: 0 0 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-row label {
            color: var(--muted);
            font-size: 13px;
        }

        .filter-row input {
            flex: 1;
            min-height: 40px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            border-radius: 999px;
            font-size: 14px;
            font-family: inherit;
        }

        .filter-row input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .filter-row button {
            min-height: 40px;
            padding: 8px 18px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: background 0.2s, transform 0.1s;
        }

        .filter-row button:hover {
            background: var(--accent-hover);
        }

        .filter-row button:active {
            transform: scale(0.97);
        }

        .file-list {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow-y: auto;
            padding: 8px;
        }

        .file-item {
            padding: 13px 14px;
            margin: 3px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            color: var(--muted);
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: var(--elevated);
        }

        .file-item.folder {
            color: var(--folder);
        }

        .file-item:hover {
            background: #373744;
        }

        .file-item.selected {
            background: var(--accent);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(124, 77, 255, 0.35);
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .workout-info {
            text-align: center;
        }

        .workout-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text);
        }

        .workout-tags {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 10px;
        }

        #chart-container {
            width: 100%;
            height: 400px;
            background: var(--panel);
            border-radius: 18px;
            padding: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        }

        canvas {
            width: 100% !important;
            height: 360px !important;
        }

        #legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 6px 2px 2px;
            font-size: 12px;
            color: var(--muted);
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .legend-swatch {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .bottom-bar {
            height: 72px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 14px;
            background: var(--panel);
            border-top: 1px solid var(--border);
        }

        .bottom-bar button {
            min-height: 48px;
            padding: 10px 40px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(124, 77, 255, 0.35);
            transition: background 0.2s, transform 0.1s;
        }

        .bottom-bar button:hover {
            background: var(--accent-hover);
        }

        .bottom-bar button:active {
            transform: scale(0.97);
        }

        /* Modal Dialog */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background-color: var(--elevated);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            min-width: 400px;
            max-width: 92vw;
            text-align: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text);
        }

        .modal-text {
            font-size: 14px;
            margin-bottom: 25px;
            color: var(--muted);
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-buttons button {
            min-height: 44px;
            padding: 10px 28px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: background 0.2s, transform 0.1s;
        }

        .modal-buttons button:active {
            transform: scale(0.97);
        }

        .btn-yes {
            background: var(--accent);
            color: white;
        }

        .btn-yes:hover {
            background: var(--accent-hover);
        }

        .btn-no {
            background: #44444f;
            color: white;
        }

        .btn-no:hover {
            background: #50505c;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a4a58;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
    <script src="../chartjs/resize-observer.min.js"></script>
    <script src="../chartjs/chartjs.3.4.1.min.js"></script>
    <script src="../i18n/i18n.js"></script>
    <script src="../workouteditor/workout-editor.js"></script>
</head>
<body>
    <div class="container">
        <!-- Left Panel: File Browser -->
        <div class="left-panel">
            <div class="filter-row">
                <label data-i18n="trainingBrowser.filter">Filter:</label>
                <input type="text" id="filterInput" placeholder="Search..." data-i18n-placeholder="trainingBrowser.searchPlaceholder">
                <button id="backButton">←</button>
            </div>
            <div class="file-list" id="fileList">
                <!-- Files will be populated here -->
            </div>
        </div>

        <!-- Right Panel: Preview -->
        <div class="right-panel">
            <div class="workout-info">
                <div class="workout-title" id="workoutTitle" data-i18n="trainingBrowser.selectWorkoutPreview">Select a workout to preview</div>
                <div class="workout-tags" id="workoutTags"></div>
            </div>
            <div id="chart-container">
                <canvas id="workoutChart"></canvas>
            </div>
            <div id="legend"></div>
        </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
        <button id="otherFoldersBtn" data-i18n="trainingBrowser.otherFolders">Other Folders</button>
    </div>

    <!-- Auto-start Modal Dialog -->
    <div class="modal" id="autoStartModal">
        <div class="modal-content">
            <div class="modal-title" data-i18n="trainingBrowser.startWorkoutQuestion">Start Workout?</div>
            <div class="modal-text" data-i18n="trainingBrowser.autoStartQuestion">Do you want to automatically start this workout?</div>
            <div class="modal-buttons">
                <button class="btn-yes" id="btnYes" data-i18n="common.yes">Yes</button>
                <button class="btn-no" id="btnNo" data-i18n="common.no">No</button>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let currentPath = '';
        let fileList = [];
        let selectedFile = null;
        let selectedIndex = -1;
        let pendingWorkoutUrl = '';
        let ws = null;
        let currentWorkoutPreview = null;

        function tq(key, fallback) {
            return window.qzTranslate ? window.qzTranslate(key, fallback) : fallback;
        }

        // Only the displayed unit is translated; SERIES_DEFS keep the English one
        var UNIT_KEYS = { 'W': 'unit.w', 'rpm': 'unit.rpm', 'km/h': 'unit.kmh', 'lvl': 'unit.level', 'spm': 'unit.spm' };

        function unitLabel(unit) {
            return UNIT_KEYS[unit] ? tq(UNIT_KEYS[unit], unit) : unit;
        }

        // Check if running in Qt WebView (offline mode)
        window.QZ_OFFLINE = false;
        if (typeof window.qt !== 'undefined' ||
            window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1') {
            window.QZ_OFFLINE = true;
        }

        // Series definitions matching the workout editor (workout-editor-app.js SERIES_DEFS).
        // Keys match the field names sent by the backend in the preview payload.
        var SERIES_DEFS = {
            treadmill: [
                { key: 'speed',       labelKey: 'workoutEditor.speed',       label: 'Speed',       color: '#42a5f5', unit: 'km/h', axis: 'speedAxis',      axisLabelKey: 'workoutEditor.speedKmh',      axisLabel: 'Speed (km/h)',  axisPosition: 'left',  fill: true  },
                { key: 'inclination', labelKey: 'workoutEditor.incline',     label: 'Incline',     color: '#26c6da', unit: '%',    axis: 'inclineAxis',    axisLabelKey: 'workoutEditor.inclinePercent', axisLabel: 'Incline (%)',   axisPosition: 'right', fill: false }
            ],
            bike: [
                { key: 'watts',      labelKey: 'workoutEditor.power',      label: 'Power',       color: '#ef6c00', unit: 'W',    axis: 'powerAxis',      axisLabelKey: 'workoutEditor.powerW',      axisLabel: 'Power (W)',     axisPosition: 'left',  fill: true  },
                { key: 'resistance', labelKey: 'workoutEditor.resistance', label: 'Resistance',  color: '#ab47bc', unit: 'lvl',  axis: 'resistanceAxis', axisLabelKey: 'workoutEditor.resistance', axisLabel: 'Resistance',    axisPosition: 'right', fill: false },
                { key: 'cadence',    labelKey: 'workoutEditor.cadence',    label: 'Cadence',     color: '#29b6f6', unit: 'rpm',  axis: 'cadenceAxis',    axisLabelKey: 'workoutEditor.cadenceRpm',  axisLabel: 'Cadence (rpm)', axisPosition: 'right', fill: false }
            ],
            elliptical: [
                { key: 'resistance', labelKey: 'workoutEditor.resistance', label: 'Resistance',  color: '#7e57c2', unit: 'lvl',  axis: 'resistanceAxis', axisLabelKey: 'workoutEditor.resistance', axisLabel: 'Resistance',    axisPosition: 'left',  fill: true  },
                { key: 'inclination', labelKey: 'workoutEditor.ramp',       label: 'Ramp',       color: '#66bb6a', unit: '%',    axis: 'inclineAxis',    axisLabelKey: 'workoutEditor.rampPercent', axisLabel: 'Ramp (%)',      axisPosition: 'right', fill: false }
            ],
            rower: [
                { key: 'watts',   labelKey: 'workoutEditor.power',      label: 'Power',       color: '#fb8c00', unit: 'W',   axis: 'powerAxis',    axisLabelKey: 'workoutEditor.powerW',            axisLabel: 'Power (W)',     axisPosition: 'left',  fill: true  },
                { key: 'cadence', labelKey: 'workoutEditor.strokeRate', label: 'Stroke Rate', color: '#26a69a', unit: 'spm', axis: 'cadenceAxis',  axisLabelKey: 'workoutEditor.strokesPerMinute', axisLabel: 'Strokes/min',   axisPosition: 'right', fill: false }
            ]
        };

        // Convert a raw value array to {x, y} point objects expected by workout-editor.js.
        // Each element can already be {x, y} or a plain number (index = seconds).
        function toPoints(arr) {
            if (!Array.isArray(arr) || arr.length === 0) return [];
            return arr.map(function(val, idx) {
                if (val !== null && typeof val === 'object' && val.x !== undefined) {
                    return {
                        x: val.x,
                        y: val.y,
                        openEnded: !!val.openEnded,
                        segmentLabel: val.segmentLabel || ''
                    };
                }
                return { x: idx, y: val };
            });
        }

        // WebSocket setup for Qt communication
        function setupWebSocket() {
            // Use location.host to automatically get the correct host and port
            const host = (!location.host || location.host.length == 0) ? 'localhost:6666' : location.host;
            const wsUrl = `ws://${host}/trainingbrowser-ws`;

            console.log('Connecting to WebSocket:', wsUrl);
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log('WebSocket connected');
                sendMessage('webtranslations', {});
                loadTrainingFolder('');
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };

            ws.onclose = function() {
                console.log('WebSocket closed');
            };
        }

        // Send message to Qt backend
        function sendMessage(type, data) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.warn('WebSocket not ready');
                return;
            }

            // QZ expects 'msg' and 'content' fields
            const message = {
                msg: type,
                content: data || {}
            };

            console.log('Sending message:', message);
            ws.send(JSON.stringify(message));
        }

        // Handle incoming messages from Qt
        function handleMessage(data) {
            console.log('Received message:', data);

            // Handle both 'type' and 'msg' fields
            const msgType = data.type || data.msg;

            if (msgType === 'trainingfiles' || msgType === 'R_loadtrainingprograms') {
                const content = data.content || data;
                handleTrainingFiles(content.files || content, content.path);
            } else if (msgType === 'workoutpreview' || msgType === 'R_trainprogram_preview') {
                const content = data.content || data;
                handleWorkoutPreview(content);
            } else if (msgType === 'R_webtranslations') {
                window.qzSetTranslations(data.content || {});
                updateWorkoutChartFromCurrent();
            }
        }

        // Load training folder
        function loadTrainingFolder(path) {
            currentPath = path;
            sendMessage('loadtrainingprograms', { path: path });
        }

        // Handle training files list
        function handleTrainingFiles(files, path) {
            fileList = files || [];
            currentPath = path || '';
            renderFileList();
        }

        // Render file list
        function renderFileList() {
            const container = document.getElementById('fileList');
            const filter = document.getElementById('filterInput').value.toLowerCase();

            container.innerHTML = '';

            fileList.forEach((file, index) => {
                // Apply filter
                if (filter && !file.name.toLowerCase().includes(filter)) {
                    return;
                }

                const div = document.createElement('div');
                div.className = 'file-item' + (file.isFolder ? ' folder' : '');
                if (index === selectedIndex) {
                    div.classList.add('selected');
                }

                // Remove extension for files
                const displayName = file.isFolder ? file.name : file.name.replace(/\.(xml|zwo)$/i, '');
                div.textContent = displayName;
                div.dataset.index = index;

                div.addEventListener('click', function() {
                    handleFileClick(index);
                });

                container.appendChild(div);
            });
        }

        // Handle file click
        function handleFileClick(index) {
            const file = fileList[index];

            if (index === selectedIndex) {
                // Double click
                if (file.isFolder) {
                    // Navigate into folder
                    loadTrainingFolder(file.path);
                    selectedIndex = -1;
                } else {
                    // Load workout with auto-start dialog
                    pendingWorkoutUrl = file.url;
                    showAutoStartDialog();
                }
            } else {
                // Single click - select and preview
                selectedIndex = index;
                renderFileList();

                if (!file.isFolder) {
                    // Load preview
                    sendMessage('trainprogram_preview', { url: file.url });
                }
            }
        }

        // Handle workout preview
        function handleWorkoutPreview(workout) {
            if (!workout) return;

            console.log('Preview workout data:', workout);
            currentWorkoutPreview = workout;

            // Update title and tags
            document.getElementById('workoutTitle').textContent = workout.description || tq('workoutEditor.workoutPreview', 'Workout Preview');
            document.getElementById('workoutTags').textContent = workout.tags || '';

            // Build normalised payload
            const workoutData = {
                points: workout.points || 0,
                watts: Array.isArray(workout.watts) ? workout.watts : [],
                speed: Array.isArray(workout.speed) ? workout.speed : [],
                inclination: Array.isArray(workout.inclination) ? workout.inclination : [],
                resistance: Array.isArray(workout.resistance) ? workout.resistance : [],
                cadence: Array.isArray(workout.cadence) ? workout.cadence : [],
                segments: Array.isArray(workout.segments) ? workout.segments : [],
                hasOpenEndedSteps: !!workout.hasOpenEndedSteps,
                deviceType: workout.deviceType || 'bike'
            };

            // Update chart using the shared workout-editor chart engine
            updateWorkoutChart(workoutData);
        }

        function updateWorkoutChartFromCurrent() {
            if (currentWorkoutPreview) {
                handleWorkoutPreview(currentWorkoutPreview);
            }
        }

        // Convert preview payload to workout-editor series format and render via WorkoutEditorApp.
        function updateWorkoutChart(workout) {
            if (!workout) return;

            // The C++ backend always populates the watts array even for treadmill workouts
            // where power is unset (sent as y = -1).  Detect the actual device type from
            // the data by checking whether any watts value is valid (>= 0).
            var hasValidWatts = Array.isArray(workout.watts) && workout.watts.some(function(p) {
                return (p !== null && typeof p === 'object' && p.y !== undefined) ? p.y >= 0 : Number(p) >= 0;
            });
            var hasSpeed = Array.isArray(workout.speed) && workout.speed.length > 0;
            var hasResistance = Array.isArray(workout.resistance) && workout.resistance.length > 0;

            var deviceType;
            if (!hasValidWatts && hasSpeed) {
                deviceType = 'treadmill';
            } else if (!hasValidWatts && hasResistance) {
                deviceType = 'elliptical';
            } else {
                deviceType = workout.deviceType || 'bike';
            }

            const seriesDefs = SERIES_DEFS[deviceType] || SERIES_DEFS.bike;

            // Derive totalSeconds from the longest non-empty array
            var totalSeconds = 0;
            ['watts', 'speed', 'inclination', 'resistance', 'cadence'].forEach(function(k) {
                if (Array.isArray(workout[k]) && workout[k].length > totalSeconds) {
                    totalSeconds = workout[k].length;
                }
            });

            // Build series list – only include series that have data (filter invalid y < 0 for watts)
            var series = [];
            seriesDefs.forEach(function(def) {
                var points = toPoints(workout[def.key]);
                // For watts, skip data points where power is invalid (y < 0 means unset)
                if (def.key === 'watts') {
                    points = points.filter(function(p) { return p.y >= 0; });
                }
                if (points.length > 0) {
                    series.push({
                        key: def.key,
                        label: tq(def.labelKey, def.label),
                        color: def.color,
                        unit: unitLabel(def.unit),
                        axis: def.axis,
                        axisLabel: tq(def.axisLabelKey, def.axisLabel),
                        axisPosition: def.axisPosition,
                        fill: def.fill,
                        points: points
                    });
                }
            });

            WorkoutEditorApp.update({
                totalSeconds: totalSeconds,
                series: series
            });
        }

        // Show auto-start dialog
        function showAutoStartDialog() {
            document.getElementById('autoStartModal').classList.add('show');
        }

        // Hide auto-start dialog
        function hideAutoStartDialog() {
            document.getElementById('autoStartModal').classList.remove('show');
        }

        // Load workout
        function loadWorkout(autoStart) {
            sendMessage('trainprogram_open_clicked', { url: pendingWorkoutUrl });

            if (autoStart) {
                setTimeout(() => {
                    sendMessage('trainprogram_autostart_requested', {});
                }, 100);
            }

            hideAutoStartDialog();
        }

        // Event listeners
        document.getElementById('filterInput').addEventListener('input', function() {
            renderFileList();
        });

        document.getElementById('backButton').addEventListener('click', function() {
            if (currentPath) {
                // Go to parent folder
                const parts = currentPath.split('/');
                parts.pop();
                const parentPath = parts.join('/');
                loadTrainingFolder(parentPath);
                selectedIndex = -1;
            }
        });

        document.getElementById('otherFoldersBtn').addEventListener('click', function() {
            sendMessage('trainprogram_open_other_folder', {});
        });

        document.getElementById('btnYes').addEventListener('click', function() {
            loadWorkout(true);
        });

        document.getElementById('btnNo').addEventListener('click', function() {
            loadWorkout(false);
        });

        // Close modal when clicking outside
        document.getElementById('autoStartModal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideAutoStartDialog();
            }
        });

        // Initialize
        window.addEventListener('load', function() {
            setupWebSocket();
        });
    </script>
</body>
</html>
